{
  "description": "Syncart grocery list server",
  "exec": "/usr/bin/node",
  "args": ["server.js"],
  "working_directory": "/opt/syncart",
  "user": "deploy",
  "group": "deploy",
  "restart": "always",
  "restart_sec": 3,
  "umask": "0027",
  "environment": {
    "NODE_ENV": "production",
    "PORT": "8787",
    "BIND_HOST": "127.0.0.1"
  },
  "permissions": {
    "network": true,
    "write": ["/var/lib/syncart"],
    "executable_memory": true
  }
}
