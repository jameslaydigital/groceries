services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /app/data/families
      PLATFORM_DB: /app/data/platform.db
      BACKUP_DIR: /app/data/backups
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      COOKIE_DOMAIN: .${BASE_DOMAIN}
      COOKIE_SECURE: "1"
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-home}
    volumes:
      - groceries-data:/app/data
    expose:
      - "8787"

  # Caddy reverse proxy with a custom build that includes the DigitalOcean
  # DNS module so it can mint a wildcard *.example.com Let's Encrypt cert.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN:?set DIGITALOCEAN_API_TOKEN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      BASE_DOMAIN: ${BASE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly SQLite backups into the persistent volume (retains KEEP_BACKUPS).
  backup:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do npm run backup --silent; sleep 86400; done"]
    environment:
      DATA_DIR: /app/data/families
      PLATFORM_DB: /app/data/platform.db
      BACKUP_DIR: /app/data/backups
      KEEP_BACKUPS: "30"
    volumes:
      - groceries-data:/app/data
    depends_on:
      - app

volumes:
  groceries-data:
  caddy_data:
  caddy_config:
